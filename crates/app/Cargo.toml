[package]
name = "fast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop chess workstation for analysis, databases, opening training and engine play."

[[bin]]
name = "fast"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-component", rev = "48ac25b50c81ca5e34ec1631e3efabe22f4af64a" }
chess_core.workspace = true
engine.workspace = true
db.workspace = true
rusqlite.workspace = true
trainer.workspace = true
ui.workspace = true
anyhow.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
smol.workspace = true
rust-embed = "8"
# Same version and features as gpui, so it adds nothing to the build.
resvg = { version = "0.46", default-features = false, features = ["text"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }

tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[package.metadata.bundle]
name = "Fast"
identifier = "dev.fast.app"
icon = ["../../assets/app/fast.png"]
category = "Utility"
short_description = "Desktop chess workstation"
