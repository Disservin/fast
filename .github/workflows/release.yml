name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read version and check the tag is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists; bump workspace.package.version in Cargo.toml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build and packaging tools
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_TAG: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev libasound2-dev \
            libvulkan1 dpkg-dev file desktop-file-utils
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_TAG/linuxdeploy-x86_64.AppImage" \
            -o "$RUNNER_TEMP/linuxdeploy"
          echo "$LINUXDEPLOY_SHA256  $RUNNER_TEMP/linuxdeploy" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/linuxdeploy"
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -Last 1
          if (!$compiler) { throw 'Inno Setup compiler was not installed' }
          "ISCC=$($compiler.FullName)" >> $env:GITHUB_ENV
      - run: cargo build --locked --release -p fast
      - run: python scripts/package_release.py
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fast $TAG" --generate-notes ./*
